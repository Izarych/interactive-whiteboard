limit_req_zone $binary_remote_addr zone=bluviboard_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bluviboard_login:10m rate=5r/m;
map $uri $bluviboard_robots {
    default "";
    ~^/admin(?:/|$) "noindex, nofollow, nosnippet";
    ~^/api(?:/|$) "noindex, nofollow, nosnippet";
}

server {
    listen 80;
    listen [::]:80;
    server_name bluviboard.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/bluviboard/acme; }
    location / { return 301 https://bluviboard.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bluviboard.ru;
    root /opt/bluviboard/current/apps/web/dist;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/bluviboard.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluviboard.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 11m;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Robots-Tag $bluviboard_robots always;
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }
    location = /admin {
        auth_basic "BluviBoard administration";
        auth_basic_user_file /etc/bluviboard/admin.htpasswd;
        try_files /index.html =404;
    }
    location ^~ /admin/ {
        auth_basic "BluviBoard administration";
        auth_basic_user_file /etc/bluviboard/admin.htpasswd;
        try_files /index.html =404;
    }
    location = /api/admin {
        auth_basic "BluviBoard administration";
        auth_basic_user_file /etc/bluviboard/admin.htpasswd;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/admin/ {
        auth_basic "BluviBoard administration";
        auth_basic_user_file /etc/bluviboard/admin.htpasswd;
        limit_req zone=bluviboard_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
    location = /api/auth/admin/login {
        auth_basic "BluviBoard administration";
        auth_basic_user_file /etc/bluviboard/admin.htpasswd;
        limit_req zone=bluviboard_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /og-image.png { try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; expires -1; try_files $uri =404; }
    location = /sw.js { expires -1; try_files $uri =404; }
    location = /offline.html { expires -1; try_files $uri =404; }
    location ~ ^/api/auth/(login|admin/login|register|forgot-password|verify-email|reset-password)$ {
        limit_req zone=bluviboard_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_req zone=bluviboard_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
