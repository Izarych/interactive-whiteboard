[package]
name = "bluviboard-desktop"
version = "0.2.0"
description = "BluviBoard Windows client"
authors = ["Artyom Plyusch"]
edition = "2021"
license = "MIT"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
open = "5"
rfd = "0.17"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
