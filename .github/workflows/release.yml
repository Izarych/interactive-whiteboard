name: Official release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Publish official version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/releases/${VERSION}.md"
          test -f "$notes"
          gh release create "$VERSION" --verify-tag --latest --title "BluviBoard ${VERSION}" --notes-file "$notes"
      - name: Remove legacy deployment releases and their tags
        if: github.ref_name == '1.0.0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^deploy-[0-9a-f]{40}$ ]]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
