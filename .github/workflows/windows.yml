name: Desktop installers

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/web/**', 'package.json', 'package-lock.json', 'tests/desktop.spec.ts', 'docs/releases/desktop/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/web/**', 'package.json', 'package-lock.json', 'tests/desktop.spec.ts', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      BLUVIBOARD_DESKTOP_PREVIEW: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.15.0', cache: npm }
      - name: Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Select toolchain
        run: rustup default 1.98.1
      - run: npm ci
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-rust-1.98.1-
      - name: Read desktop version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm run assets --workspace @whiteboard/desktop
      - run: npm run build:offline --workspace @whiteboard/desktop
      - run: npm run desktop:check
      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:BLUVIBOARD_DESKTOP_PREVIEW -eq 'true') {
            npm run bundle --workspace @whiteboard/desktop -- --config src-tauri/tauri.preview.conf.json
          } else {
            npm run desktop:build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - run: npm run build:web
      - name: Install WebView2 for the native smoke check
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne 'Valid') { throw 'Invalid WebView2 installer signature' }
          $process = Start-Process $setup -ArgumentList '/silent', '/install' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WebView2 setup failed: $($process.ExitCode)" }
      - name: Package installer and checksum
        run: node apps/desktop/scripts/package.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BluviBoard-Windows-x64
          path: apps/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Install, check and uninstall the Windows application
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'apps/desktop/artifacts/*.exe').FullName
          $directory = Join-Path $env:RUNNER_TEMP 'BluviBoard-installed'
          $install = Start-Process $installer -ArgumentList "/S /D=$directory" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation failed: $($install.ExitCode)" }
          $env:BLUVIBOARD_DESKTOP_EXECUTABLE = Join-Path $directory 'bluviboard-desktop.exe'
          if (-not (Test-Path $env:BLUVIBOARD_DESKTOP_EXECUTABLE)) { throw 'Installed executable is missing' }
          try {
            node apps/desktop/scripts/smoke.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows check failed' }
          } finally {
            $uninstall = Start-Process (Join-Path $directory 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          }
          if (Test-Path $env:BLUVIBOARD_DESKTOP_EXECUTABLE) { throw 'Uninstall did not remove the application' }
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: Windows-diagnostics
          path: apps/desktop/artifacts/native-smoke.*
          if-no-files-found: ignore

  macos:
    name: Build and verify macOS ${{ matrix.arch }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BLUVIBOARD_DESKTOP_PREVIEW: ${{ github.ref != 'refs/heads/main' }}
      BLUVIBOARD_MACOS_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.15.0', cache: npm }
      - name: Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --target ${{ matrix.target }}
      - run: rustup default 1.98.1
      - run: npm ci
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: mac-rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-${{ matrix.arch }}-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: macos-${{ matrix.arch }}-rust-1.98.1-
      - run: npm run assets --workspace @whiteboard/desktop
      - run: npm run build:offline --workspace @whiteboard/desktop
      - name: Native Rust and Keychain tests
        run: npm run desktop:check
      - name: Build macOS installer
        shell: bash
        run: |
          if [[ "$BLUVIBOARD_DESKTOP_PREVIEW" == true ]]; then
            npm exec --workspace @whiteboard/desktop -- tauri build --ci --bundles app --verbose --target ${{ matrix.target }} --config src-tauri/tauri.preview.conf.json
          else
            npm exec --workspace @whiteboard/desktop -- tauri build --ci --bundles app --verbose --target ${{ matrix.target }}
          fi
      - name: Create the drag-to-Applications disk image
        run: node apps/desktop/scripts/create-macos-dmg.cjs
      - run: node apps/desktop/scripts/package-macos.cjs
      - name: Install the DMG and check the real WKWebView
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/BluviBoard-mount"
          install="$RUNNER_TEMP/BluviBoard-installed"
          mkdir -p "$mount" "$install"
          dmg=$(find apps/desktop/artifacts -name '*.dmg' -print -quit)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          source=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          cp -R "$source" "$install/"
          app="$install/$(basename "$source")"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/bluviboard-desktop"
          if [[ "$BLUVIBOARD_MACOS_ARCH" == arm64 ]]; then
            lipo "$app/Contents/MacOS/bluviboard-desktop" -verify_arch arm64
          else
            lipo "$app/Contents/MacOS/bluviboard-desktop" -verify_arch x86_64
          fi
          export BLUVIBOARD_DESKTOP_EXECUTABLE="$app/Contents/MacOS/bluviboard-desktop"
          node apps/desktop/scripts/macos-smoke.cjs
          rm -rf -- "$app"
          test ! -e "$app"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always() && steps.mac-rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-${{ matrix.arch }}-rust-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BluviBoard-macOS-${{ matrix.arch }}
          path: apps/desktop/artifacts/*.dmg*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: apps/desktop/artifacts/macos-*
          if-no-files-found: ignore

  publish:
    name: Publish a new desktop version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: BluviBoard-*
          merge-multiple: true
          path: artifacts
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="desktop-v${VERSION}"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Desktop ${VERSION} is already published. Increase the desktop version to publish a new installer."
            exit 0
          fi
          test -f "docs/releases/desktop/${VERSION}.md"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "BluviBoard для Windows и macOS ${VERSION}" --notes-file "docs/releases/desktop/${VERSION}.md" artifacts/*
      - name: Attach installers to the main product release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/sync-release-assets.cjs
